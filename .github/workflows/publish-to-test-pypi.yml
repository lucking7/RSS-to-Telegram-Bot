name: Publish to Test PyPI
on:
  pull_request:
    paths:
      - '.github/workflows/publish-to-test-pypi.yml'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'src/version.py'
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.sample'
  workflow_dispatch: ~
jobs:
  build-n-publish:
    name: Build and publish package to Test PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install pypa/build
        run: |
          python -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: |
          BASE_VERSION=$(python -c 'import runpy; print(runpy.run_path("src/version.py")["__version__"])')
          REVISION_COUNT=$(git rev-list --count HEAD)
          printf '__version__ = "%s.post%s"\n' "$BASE_VERSION" "$REVISION_COUNT" > src/version.py
          python -m build --sdist --wheel --outdir dist/ .
      - name: Check optional Test PyPI publishing
        id: publish
        env:
          PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request && -n "$PUBLISH_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Package built successfully; publishing skipped for pull requests or without TEST_PYPI_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish distribution to Test PyPI
        if: steps.publish.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
          print_hash: true
          skip_existing: true
